<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Senhas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d2d4e;
      color: #fff;
      font-family: Arial, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px 40px;
      background: #0d2d4e;
      border-bottom: 3px solid #1a6fa8;
    }

    .header img {
      height: 52px;
      object-fit: contain;
    }

    .header-text {
      text-align: center;
    }

    .header-text h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .header-text p {
      font-size: 14px;
      opacity: 0.7;
      margin-top: 2px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 24px 40px;
    }

    .row-tipos {
      display: flex;
      gap: 40px;
      flex: 1;
    }

    .card {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 24px;
      padding: 28px 30px;
      text-align: center;
      border: 3px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card.flash {
      animation: flash 0.6s ease;
    }

    @keyframes flash {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.04); border-color: rgba(255,255,255,0.6); }
      100% { transform: scale(1); }
    }

    .card-label {
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      opacity: 0.75;
      margin-bottom: 4px;
    }

    .card-sublabel {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.45;
      margin-bottom: 12px;
    }

    .card-numero {
      font-size: 110px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -4px;
    }

    .card-numero.vazio {
      opacity: 0.2;
      font-size: 60px;
    }

    .card-preferencial .card-numero { color: #f87171; }
    .card-normal      .card-numero { color: #4ade80; }

    /* Quadro de última senha chamada */
    .card-ultima {
      background: rgba(26, 111, 168, 0.2);
      border: 3px solid #1a6fa8;
      border-radius: 20px;
      padding: 20px 40px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    .card-ultima.flash-ultima {
      animation: flashUltima 0.8s ease;
    }

    @keyframes flashUltima {
      0%   { border-color: #1a6fa8; background: rgba(26,111,168,0.2); }
      30%  { border-color: #fff;    background: rgba(255,255,255,0.15); }
      100% { border-color: #1a6fa8; background: rgba(26,111,168,0.2); }
    }

    .ultima-label {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      opacity: 0.6;
      white-space: nowrap;
    }

    .ultima-numero {
      font-size: 72px;
      font-weight: 900;
      letter-spacing: -2px;
      color: #fff;
      line-height: 1;
    }

    .ultima-numero.vazio {
      opacity: 0.2;
      font-size: 40px;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 16px;
      opacity: 0.6;
      font-size: 13px;
    }

    .footer-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1a6fa8;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* Overlay para ativar som na Smart TV */
    .overlay-som {
      position: fixed;
      inset: 0;
      background: rgba(8, 30, 53, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
    }

    .overlay-som .icone {
      font-size: 80px;
      margin-bottom: 24px;
    }

    .overlay-som p {
      font-size: 28px;
      font-weight: 700;
    }

    .overlay-som span {
      font-size: 16px;
      opacity: 0.6;
      margin-top: 12px;
    }

    /* Seletor de filial */
    .seletor {
      position: fixed;
      inset: 0;
      background: #0d2d4e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      gap: 20px;
    }

    .seletor img { height: 60px; margin-bottom: 10px; }
    .seletor h2 { font-size: 22px; }

    .seletor input {
      font-size: 20px;
      padding: 14px 20px;
      border-radius: 10px;
      border: 2px solid #1a6fa8;
      background: #081e35;
      color: white;
      text-align: center;
      width: 260px;
      outline: none;
    }

    .seletor button {
      font-size: 18px;
      padding: 14px 40px;
      border-radius: 10px;
      border: none;
      background: #1a6fa8;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Seletor de filial se não vier na URL -->
  <div class="seletor" id="seletor">
    <img src="logo.png" alt="Santa Apolônia">
    <h2>Identificar Loja</h2>
    <input type="text" id="input-filial" placeholder="Ex: loja01" autocomplete="off">
    <button onclick="confirmarFilial()">Confirmar</button>
  </div>

  <!-- Overlay som Smart TV -->
  <div class="overlay-som hidden" id="overlay-som" onclick="ativarSom()">
    <div class="icone">🔊</div>
    <p>Toque para ativar o som</p>
    <span>Necessário uma vez ao ligar a TV</span>
  </div>

  <div class="header">
    <img src="logo.png" alt="Santa Apolônia">
    <div class="header-text">
      <h1>PAINEL DE ATENDIMENTO</h1>
      <p id="nome-filial">Carregando...</p>
    </div>
  </div>

  <div class="main">
    <div class="row-tipos">
      <div class="card card-preferencial" id="card-p">
        <div class="card-label">Preferencial</div>
        <div class="card-sublabel">Última chamada</div>
        <div class="card-numero vazio" id="num-p">---</div>
      </div>

      <div class="card card-normal" id="card-n">
        <div class="card-label">Normal</div>
        <div class="card-sublabel">Última chamada</div>
        <div class="card-numero vazio" id="num-n">---</div>
      </div>
    </div>

    <div class="card-ultima" id="card-ultima">
      <div class="ultima-label">Última senha chamada</div>
      <div class="ultima-numero vazio" id="num-ultima">---</div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-dot"></div>
    <span id="hora-atual"></span>
    <div class="footer-dot"></div>
  </div>

  <script>
    let filial = new URLSearchParams(location.search).get('filial') || localStorage.getItem('filial_painel') || '';
    let ultimaGeral = '';
    let somAtivo = false;

    function confirmarFilial() {
      const val = document.getElementById('input-filial').value.trim();
      if (!val) return;
      filial = val;
      localStorage.setItem('filial_painel', filial);
      document.getElementById('seletor').classList.add('hidden');
      iniciar();
    }

    document.getElementById('input-filial').addEventListener('keydown', e => {
      if (e.key === 'Enter') confirmarFilial();
    });

    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function tocarChime() {
      try {
        const ctx = getAudioCtx();
        const notas = [783.99, 659.25, 523.25, 659.25];
        notas.forEach((freq, i) => {
          const osc  = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.value = freq;
          const t = ctx.currentTime + i * 0.18;
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.4, t + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
          osc.start(t);
          osc.stop(t + 0.4);
        });
      } catch(e) {}
    }

    function ativarSom() {
      somAtivo = true;
      document.getElementById('overlay-som').classList.add('hidden');
      try { getAudioCtx(); } catch(e) {}
    }

    function falar(tipo, numero) {
      if (!somAtivo) return;
      tocarChime();
      const num = String(numero).padStart(3, '0');
      const arquivo = `/audio2/${tipo === 'P' ? 'p' : 'n'}_${num}.m4a`;
      setTimeout(() => {
        const audio = new Audio(arquivo);
        audio.play().catch(() => {});
      }, 900);
    }

    function fmt(n) {
      return String(n).padStart(3, '0');
    }

    function flash(id, cls) {
      const el = document.getElementById(id);
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
    }

    async function atualizar() {
      if (!filial) return;
      try {
        const res = await fetch(`/dados?filial=${filial}`);
        const d = await res.json();

        const numP = d.senha_p > 0 ? 'P-' + fmt(d.senha_p) : '---';
        const numN = d.senha_n > 0 ? 'N-' + fmt(d.senha_n) : '---';

        const elP = document.getElementById('num-p');
        const elN = document.getElementById('num-n');
        const elU = document.getElementById('num-ultima');

        elP.textContent = numP;
        elP.classList.toggle('vazio', d.senha_p === 0);

        elN.textContent = numN;
        elN.classList.toggle('vazio', d.senha_n === 0);

        elU.textContent = d.ultima_geral || '---';
        elU.classList.toggle('vazio', !d.ultima_geral);

        if (d.ultima_geral && d.ultima_geral !== ultimaGeral) {
          ultimaGeral = d.ultima_geral;
          flash('card-ultima', 'flash-ultima');

          if (ultimaGeral.startsWith('P')) {
            flash('card-p', 'flash');
            falar('P', d.senha_p);
          } else {
            flash('card-n', 'flash');
            falar('N', d.senha_n);
          }
        }
      } catch (e) {
        console.error('Erro ao buscar dados:', e);
      }
    }

    function atualizarHora() {
      document.getElementById('hora-atual').textContent =
        new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function iniciar() {
      document.getElementById('nome-filial').textContent = filial.toUpperCase();
      document.getElementById('overlay-som').classList.remove('hidden');
      atualizar();
      setInterval(atualizar, 2000);
      setInterval(atualizarHora, 1000);
      atualizarHora();
    }

    if (filial) {
      document.getElementById('seletor').classList.add('hidden');
      iniciar();
    }
  </script>
</body>
</html>
