<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Chamador de Senhas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary:       #0d2d4e;
      --primary-dark:  #0d2d4e;
      --primary-light: #1a6fa8;
      --preferencial:  #d97706;
      --normal:        #0891b2;
      --success:       #0e9f6e;
      --danger:        #e02424;
      --gray-50:       #f9fafb;
      --gray-100:      #f3f4f6;
      --gray-200:      #e5e7eb;
      --gray-500:      #6b7280;
      --gray-700:      #374151;
      --gray-900:      #111827;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-100);
      color: var(--gray-900);
      min-height: 100vh;
    }

    .header {
      background: var(--primary);
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 3px solid var(--primary-light);
    }

    .header img { height: 40px; object-fit: contain; }
    .header-info h1 { font-size: 18px; font-weight: 700; }
    .header-info p  { font-size: 12px; opacity: 0.7; margin-top: 2px; }

    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: 14px;
      padding: 20px 24px;
    }

    .card-titulo {
      font-size: 11px;
      font-weight: 700;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 16px;
    }

    /* Totais gerais */
    .totais-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .total-item {
      background: var(--gray-50);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      border: 1px solid var(--gray-200);
    }

    .total-item .valor {
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
    }

    .total-item .label {
      font-size: 12px;
      color: var(--gray-500);
      margin-top: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .total-item.p   .valor { color: var(--preferencial); }
    .total-item.n   .valor { color: var(--normal); }
    .total-item.tot .valor { color: var(--primary); }
    .total-item.orc .valor { color: var(--success); }
    .total-item.pct .valor { color: var(--primary-light); }

    /* Tabela por filial */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead tr {
      background: var(--gray-50);
      border-bottom: 2px solid var(--gray-200);
    }

    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    th.right, td.right { text-align: right; }
    th.center, td.center { text-align: center; }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--gray-100);
    }

    tbody tr:hover { background: var(--gray-50); }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge-p   { background: #fef3c7; color: #92400e; }
    .badge-n   { background: #cffafe; color: #155e75; }
    .badge-pct { background: #dcfce7; color: #166534; }
    .badge-low { background: #fee2e2; color: #991b1b; }

    /* Input orçamentos inline */
    .input-orc {
      width: 80px;
      padding: 6px 10px;
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      font-family: inherit;
      color: var(--gray-900);
      background: white;
    }

    .input-orc:focus {
      outline: none;
      border-color: var(--primary-light);
    }

    .btn-salvar-orc {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-left: 6px;
    }

    /* Filial link */
    .filial-link {
      color: var(--primary-light);
      text-decoration: none;
      font-weight: 700;
    }

    .filial-link:hover { text-decoration: underline; }

    /* Atualização */
    .refresh-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--gray-500);
    }

    .btn-refresh {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--gray-200);
      background: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--gray-700);
      font-family: inherit;
    }

    .dot-online {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 6px;
    }

    .vazio-msg {
      text-align: center;
      padding: 40px;
      color: var(--gray-500);
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="logo.png" alt="Santa Apolônia">
    <div class="header-info">
      <h1>Dashboard de Atendimento</h1>
      <p id="data-hoje">—</p>
    </div>
  </div>

  <div class="content">

    <div class="refresh-bar">
      <span><span class="dot-online"></span> Atualizado às <span id="ultima-att">—</span></span>
      <button class="btn-refresh" onclick="carregar()">↻ Atualizar</button>
    </div>

    <!-- Totais consolidados -->
    <div class="card">
      <div class="card-titulo">Consolidado — Todas as Filiais</div>
      <div class="totais-grid">
        <div class="total-item p">
          <div class="valor" id="tot-p">0</div>
          <div class="label">Preferencial</div>
        </div>
        <div class="total-item n">
          <div class="valor" id="tot-n">0</div>
          <div class="label">Normal</div>
        </div>
        <div class="total-item tot">
          <div class="valor" id="tot-total">0</div>
          <div class="label">Total Senhas</div>
        </div>
        <div class="total-item orc">
          <div class="valor" id="tot-orc">0</div>
          <div class="label">Orçamentos</div>
        </div>
        <div class="total-item pct">
          <div class="valor" id="tot-pct">—%</div>
          <div class="label">Conversão</div>
        </div>
      </div>
    </div>

    <!-- Tabela por filial -->
    <div class="card">
      <div class="card-titulo">Por Filial</div>
      <div id="tabela-container">
        <div class="vazio-msg">Carregando...</div>
      </div>
    </div>

  </div>

  <script>
    function hoje() {
      return new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
    }

    document.getElementById('data-hoje').textContent = hoje();

    function pct(orc, total) {
      if (!total || !orc) return '—';
      return Math.round((orc / total) * 100) + '%';
    }

    function pctClass(orc, total) {
      if (!total || !orc) return 'badge-n';
      const p = (orc / total) * 100;
      return p >= 50 ? 'badge-pct' : 'badge-low';
    }

    async function salvarOrcamento(filial, input) {
      const val = parseInt(input.value) || 0;
      await fetch(`/orcamentos?filial=${filial}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quantidade: val })
      });
      await carregar();
    }

    async function carregar() {
      try {
        const res = await fetch('/resumo');
        const dados = await res.json();

        const filiais = Object.keys(dados).sort();

        let totP = 0, totN = 0, totOrc = 0;

        filiais.forEach(f => {
          const d = dados[f];
          totP   += d.hoje_p || 0;
          totN   += d.hoje_n || 0;
          totOrc += d.orcamentos || 0;
        });

        const totTotal = totP + totN;

        document.getElementById('tot-p').textContent     = totP;
        document.getElementById('tot-n').textContent     = totN;
        document.getElementById('tot-total').textContent = totTotal;
        document.getElementById('tot-orc').textContent   = totOrc;
        document.getElementById('tot-pct').textContent   = pct(totOrc, totTotal);

        document.getElementById('ultima-att').textContent =
          new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

        if (filiais.length === 0) {
          document.getElementById('tabela-container').innerHTML =
            '<div class="vazio-msg">Nenhuma filial ativa ainda. Abra o Operador em alguma loja.</div>';
          return;
        }

        const linhas = filiais.map(f => {
          const d = dados[f];
          const sp = d.hoje_p || 0;
          const sn = d.hoje_n || 0;
          const total = sp + sn;
          const orc = d.orcamentos || 0;
          const p = pct(orc, total);
          const pc = pctClass(orc, total);

          return `
            <tr>
              <td>
                <a class="filial-link" href="operador.html?filial=${f}" target="_blank">${f.toUpperCase()}</a>
              </td>
              <td class="center"><span class="badge badge-p">${sp}</span></td>
              <td class="center"><span class="badge badge-n">${sn}</span></td>
              <td class="center"><strong>${total}</strong></td>
              <td class="center">
                <input class="input-orc" type="number" min="0" value="${orc}"
                  id="orc-${f}"
                  onkeydown="if(event.key==='Enter') salvarOrcamento('${f}', this)">
                <button class="btn-salvar-orc" onclick="salvarOrcamento('${f}', document.getElementById('orc-${f}'))">OK</button>
              </td>
              <td class="center"><span class="badge ${pc}">${p}</span></td>
            </tr>`;
        }).join('');

        document.getElementById('tabela-container').innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Filial</th>
                <th class="center">Preferencial</th>
                <th class="center">Normal</th>
                <th class="center">Total</th>
                <th class="center">Orçamentos</th>
                <th class="center">Conversão</th>
              </tr>
            </thead>
            <tbody>${linhas}</tbody>
          </table>`;

      } catch (e) {
        console.error('Erro ao carregar resumo:', e);
      }
    }

    carregar();
    setInterval(carregar, 30000);
  </script>
</body>
</html>
